<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSO Authentication - Pramaan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            background: linear-gradient(135deg, #861f41 0%, #6b1833 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .callback-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #861f41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h2 {
            color: #333;
            margin-bottom: 0.5rem;
        }

        p {
            color: #666;
            font-size: 0.95rem;
        }

        .error-state {
            display: none;
        }

        .error-state h2 {
            color: #c33;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .btn-retry {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #861f41 0%, #6b1833 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-retry:hover {
            opacity: 0.9;
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background: #4CAF50;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 30px;
            height: 30px;
            fill: white;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="callback-container">
        <div id="loadingState">
            <div class="loader"></div>
            <h2>Authenticating...</h2>
            <p>Please wait while we complete your SSO login.</p>
        </div>

        <div id="successState" style="display: none;">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
            </div>
            <h2>Login Successful!</h2>
            <p>Redirecting to your dashboard...</p>
        </div>

        <div id="errorState" class="error-state">
            <h2>Authentication Failed</h2>
            <div id="errorMessage" class="error-message"></div>
            <a href="/static/athlete-login.html" class="btn-retry">Try Again</a>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const athleteData = urlParams.get('athlete');

        const loadingState = document.getElementById('loadingState');
        const successState = document.getElementById('successState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');

        function showError(message) {
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
            errorMessage.textContent = message;
        }

        function showSuccess() {
            loadingState.style.display = 'none';
            successState.style.display = 'block';
        }

        // Process the authentication callback
        if (token && athleteData) {
            try {
                // Parse athlete data
                const athlete = JSON.parse(decodeURIComponent(athleteData));

                // Store authentication data
                localStorage.setItem('athleteToken', token);
                localStorage.setItem('athlete', JSON.stringify(athlete));

                // Show success state
                showSuccess();

                // Redirect to dashboard after a short delay
                setTimeout(() => {
                    window.location.href = '/static/athlete-dashboard.html';
                }, 1500);
            } catch (error) {
                console.error('Error processing SSO callback:', error);
                showError('Failed to process authentication response. Please try again.');
            }
        } else {
            // No token or athlete data - show error
            showError('No authentication data received. Please try logging in again.');
        }

        // Clear URL parameters for security
        window.history.replaceState({}, document.title, window.location.pathname);
    </script>
</body>
</html>
