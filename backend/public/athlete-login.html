<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlete Login - Pramaan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            background: linear-gradient(135deg, #861f41 0%, #6b1833 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 450px;
            max-width: 90%;
        }

        .login-header {
            background: linear-gradient(135deg, #861f41 0%, #6b1833 100%);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .login-form {
            padding: 2.5rem 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #861f41;
            box-shadow: 0 0 0 3px rgba(134, 31, 65, 0.1);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #861f41 0%, #6b1833 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(134, 31, 65, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #666;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            padding: 0 1rem;
        }

        .btn-saml {
            width: 100%;
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-saml:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(26, 115, 232, 0.3);
        }

        .btn-saml svg {
            width: 20px;
            height: 20px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .link-container {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .link-container a {
            color: #861f41;
            text-decoration: none;
            font-weight: 500;
        }

        .link-container a:hover {
            text-decoration: underline;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="/static/pramaan.png" alt="Pramaan Logo" style="max-width: 200px; height: auto; margin-bottom: 1rem;">
            <h1>Krida e-Pramaan</h1>
            <p>Athlete Portal - Access Your Certificates</p>
        </div>

        <div class="login-form">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter your email or username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">Login</span>
                    <div class="loader" id="loader"></div>
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="btn-saml" onclick="loginWithSAML()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                Login with Sports Portal (SSO)
            </button>

            <div class="link-container">
                Don't have an account? <a href="/static/athlete-signup.html">Sign up here</a><br>
                <a href="/static/login.html">Admin Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            loginBtn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';

            const formData = new FormData(e.target);
            const loginData = {
                email: formData.get('email'),
                password: formData.get('password')
            };

            try {
                const response = await fetch(`${API_BASE}/athletes/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('athleteToken', result.token);
                    localStorage.setItem('athlete', JSON.stringify(result.athlete));

                    successDiv.textContent = 'Login successful! Redirecting...';
                    successDiv.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = '/static/athlete-dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(result.message || 'Invalid credentials');
                }
            } catch (error) {
                errorDiv.textContent = error.message || 'Login failed. Please try again.';
                errorDiv.style.display = 'block';

                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                loader.style.display = 'none';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('athleteToken')) {
            window.location.href = '/static/athlete-dashboard.html';
        }

        // SAML Login function
        function loginWithSAML() {
            window.location.href = '/api/saml/login';
        }

        // Check for SAML error messages in URL
        const urlParams = new URLSearchParams(window.location.search);
        const samlError = urlParams.get('error');
        const logout = urlParams.get('logout');

        if (samlError) {
            const errorDiv = document.getElementById('errorMessage');
            const errorMessages = {
                'saml_init_failed': 'Failed to initiate SSO login. Please try again.',
                'no_saml_response': 'No response received from SSO provider.',
                'invalid_saml_response': 'Invalid response from SSO provider.',
                'no_nameid': 'SSO provider did not return user identification.',
                'saml_validation_failed': 'SSO authentication failed. Please try again.',
                'assertion_expired': 'SSO session expired. Please try again.',
                'invalid_signature': 'SSO response signature invalid. Please contact support.'
            };
            errorDiv.textContent = errorMessages[samlError] || 'SSO login failed. Please try again.';
            errorDiv.style.display = 'block';
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        if (logout === 'success') {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = 'You have been logged out successfully.';
            successDiv.style.display = 'block';
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
