<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krida e-Pramaan - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            width: 400px;
            max-width: 90%;
        }

        .login-header {
            background: linear-gradient(135deg, #861f41 0%, #6b1833 100%);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .login-form {
            padding: 2.5rem 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #861f41;
            box-shadow: 0 0 0 3px rgba(134, 31, 65, 0.1);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #861f41 0%, #6b1833 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(134, 31, 65, 0.3);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .demo-credentials {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 5px;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #666;
        }

        .demo-credentials strong {
            color: #333;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .tabs-container {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 2rem;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: transparent;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .tab:hover {
            color: #861f41;
        }

        .tab.active {
            color: #861f41;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(135deg, #861f41 0%, #6b1833 100%);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .registration-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }

        .registration-link a {
            color: #861f41;
            text-decoration: none;
            font-weight: 500;
        }

        .registration-link a:hover {
            text-decoration: underline;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="/static/epramaan-logo.jpg" alt="e-Pramaan Logo" style="max-width: 200px; height: auto; margin-bottom: 1rem;">
            <h1>Krida e-Pramaan</h1>
            <p>Sports Certificate Management System - Maharashtra</p>
        </div>

        <div class="login-form">
            <div class="tabs-container">
                <button class="tab active" onclick="switchTab('admin')">
                    🔐 Admin
                </button>
                <button class="tab" onclick="switchTab('athlete')">
                    🏃 Athletes
                </button>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Admin Login Tab -->
            <div id="adminTab" class="tab-content active">
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="adminUsername">Username</label>
                        <input
                            type="text"
                            id="adminUsername"
                            name="username"
                            placeholder="Enter your username"
                            required
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="adminPassword">Password</label>
                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn-login" id="adminLoginBtn">
                        <span id="adminBtnText">Login to Admin Dashboard</span>
                        <div class="loader" id="adminLoader"></div>
                    </button>
                </form>

                <div class="demo-credentials">
                    <strong>Demo Admin Credentials:</strong><br>
                    Username: admin<br>
                    Password: admin123
                </div>
            </div>

            <!-- Athlete Login Tab -->
            <div id="athleteTab" class="tab-content">
                <form id="athleteLoginForm">
                    <div class="form-group">
                        <label for="athleteEmail">Email</label>
                        <input
                            type="email"
                            id="athleteEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="athletePassword">Password</label>
                        <input
                            type="password"
                            id="athletePassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn-login" id="athleteLoginBtn">
                        <span id="athleteBtnText">Login to Athlete Dashboard</span>
                        <div class="loader" id="athleteLoader"></div>
                    </button>
                </form>

                <div class="registration-link">
                    Don't have an account? <a href="/static/athlete-registration.html">Register here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
