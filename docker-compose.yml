version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cert_postgres
    environment:
      POSTGRES_USER: certadmin
      POSTGRES_PASSWORD: certpass123
      POSTGRES_DB: certificate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cert_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cert_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cert.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cert_network

  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: cert_ipfs
    environment:
      IPFS_PROFILE: server
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs
    networks:
      - cert_network

  backend:
    build: ./backend
    container_name: cert_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://certadmin:certpass123@postgres:5432/certificate_db
      IPFS_API: http://ipfs:5001
      PORT: 3000
      BLOCKCHAIN_RPC: http://host.docker.internal:8545
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - cert_network
    command: npm run dev

volumes:
  postgres_data:
  ipfs_staging:
  ipfs_data:

networks:
  cert_network:
    driver: bridge